# Local run: `docker compose up --build`, with your test keys in .env (see .env.example).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: payments
      POSTGRES_USER: payments
      POSTGRES_PASSWORD: payments
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payments"]
      interval: 2s
      retries: 15

  payments:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/payments
      DATABASE_USERNAME: payments
      DATABASE_PASSWORD: payments
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
